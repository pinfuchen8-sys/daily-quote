<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="每日一句">
<meta name="theme-color" content="#1a1a2e">
<title>每日一句</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #242440;
    --accent-pos: #f0c060;
    --accent-neg: #7eb8d4;
    --text: #f0ede8;
    --text-muted: #9090b0;
    --border: rgba(255,255,255,0.08);
    --radius: 18px;
    --shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 80px;
    position: relative;
    overflow-x: hidden;
  }

  /* Background orbs */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.18;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 400px; height: 400px;
    background: radial-gradient(circle, #f0c060, transparent);
    top: -100px; right: -100px;
  }
  body::after {
    width: 350px; height: 350px;
    background: radial-gradient(circle, #7eb8d4, transparent);
    bottom: 80px; left: -100px;
  }

  .container { width: 100%; max-width: 480px; padding: 0 20px; position: relative; z-index: 1; }

  /* Header */
  header {
    width: 100%; max-width: 480px;
    padding: 52px 24px 20px;
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px; font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text);
  }
  .logo span { color: var(--accent-pos); }
  .date-badge {
    font-size: 12px; color: var(--text-muted);
    background: var(--surface);
    padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--border);
    letter-spacing: 0.03em;
  }

  /* Main Quote Card */
  .quote-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 36px 28px 28px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: opacity 0.4s, transform 0.4s;
  }
  .quote-card.fade-out { opacity: 0; transform: translateY(10px) scale(0.98); }
  .quote-card.fade-in { animation: fadeIn 0.5s ease forwards; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .quote-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .quote-card.positive::before { background: linear-gradient(90deg, var(--accent-pos), #ffb830); }
  .quote-card.negative::before { background: linear-gradient(90deg, var(--accent-neg), #4a90b8); }

  .quote-type {
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 6px;
  }
  .quote-type .dot {
    width: 6px; height: 6px; border-radius: 50%;
  }
  .positive .quote-type { color: var(--accent-pos); }
  .positive .quote-type .dot { background: var(--accent-pos); }
  .negative .quote-type { color: var(--accent-neg); }
  .negative .quote-type .dot { background: var(--accent-neg); }

  .open-quote {
    font-family: 'Noto Serif TC', serif;
    font-size: 56px; line-height: 0.7;
    color: var(--text-muted); opacity: 0.25;
    position: absolute; top: 18px; right: 24px;
    user-select: none;
  }

  .quote-text {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(18px, 5vw, 22px);
    line-height: 1.75;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text);
    margin-bottom: 20px;
    word-break: break-all;
  }

  .quote-source {
    font-size: 13px; color: var(--text-muted);
    text-align: right; font-style: italic;
    min-height: 18px;
  }

  .card-actions {
    display: flex; justify-content: space-between;
    align-items: center; margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    gap: 10px;
  }

  .btn {
    border: none; cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px; font-weight: 500;
    border-radius: 12px;
    padding: 10px 18px;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn:active { transform: scale(0.95); }

  .btn-reshuffle {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    flex: 1;
  }
  .btn-reshuffle:hover { background: #2e2e50; }

  .btn-daily {
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
    font-size: 12px;
    padding: 10px 14px;
  }

  .btn-icon { font-size: 16px; }

  /* Section titles */
  .section-title {
    font-size: 13px; font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.1em; text-transform: uppercase;
    margin: 32px 0 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after {
    content: ''; flex: 1; height: 1px;
    background: var(--border);
  }

  /* Add quote form */
  .add-form {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 20px;
  }
  .form-row { margin-bottom: 12px; }
  textarea, input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    padding: 12px 14px;
    outline: none;
    resize: none;
    transition: border-color 0.2s;
  }
  textarea:focus, input:focus { border-color: var(--accent-pos); }
  textarea { height: 80px; line-height: 1.6; }
  input[type="text"] { height: 42px; }

  .form-hint {
    font-size: 11px; color: var(--text-muted);
    margin-bottom: 8px;
  }

  .toggle-row {
    display: flex; gap: 8px; margin-bottom: 14px;
  }
  .toggle-btn {
    flex: 1; padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 12px; cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans TC', sans-serif;
  }
  .toggle-btn.active-pos { background: rgba(240,192,96,0.15); border-color: var(--accent-pos); color: var(--accent-pos); }
  .toggle-btn.active-neg { background: rgba(126,184,212,0.15); border-color: var(--accent-neg); color: var(--accent-neg); }

  .btn-add {
    width: 100%;
    background: var(--accent-pos);
    color: #1a1a2e;
    font-weight: 700; font-size: 14px;
    padding: 12px;
    border-radius: 10px;
    justify-content: center;
  }
  .btn-add:hover { background: #f8d080; }

  /* Quote List */
  .quote-list { display: flex; flex-direction: column; gap: 10px; }

  .quote-item {
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--border);
    padding: 14px 16px;
    display: flex; align-items: flex-start;
    gap: 12px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .quote-item-bar {
    width: 3px; border-radius: 2px; flex-shrink: 0;
    align-self: stretch; min-height: 20px;
  }
  .quote-item-bar.pos { background: var(--accent-pos); }
  .quote-item-bar.neg { background: var(--accent-neg); }

  .quote-item-body { flex: 1; min-width: 0; }
  .quote-item-text {
    font-size: 14px; line-height: 1.65;
    color: var(--text); word-break: break-all;
  }
  .quote-item-meta {
    font-size: 11px; color: var(--text-muted);
    margin-top: 4px;
    display: flex; gap: 8px; align-items: center;
  }
  .tag-pos { color: var(--accent-pos); }
  .tag-neg { color: var(--accent-neg); }

  .btn-delete {
    background: none; border: none;
    color: var(--text-muted); cursor: pointer;
    font-size: 16px; padding: 2px 4px;
    flex-shrink: 0;
    border-radius: 6px;
    transition: all 0.2s;
    line-height: 1;
  }
  .btn-delete:hover { color: #e07070; background: rgba(220,80,80,0.1); }

  .empty-state {
    text-align: center; color: var(--text-muted);
    font-size: 13px; padding: 24px 0;
  }

  /* Tabs */
  .tabs {
    display: flex; background: var(--surface);
    border-radius: 12px; padding: 4px;
    border: 1px solid var(--border);
    gap: 4px;
  }
  .tab {
    flex: 1; padding: 9px;
    border-radius: 8px;
    border: none; background: none;
    color: var(--text-muted); cursor: pointer;
    font-size: 13px; font-weight: 500;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.2s;
  }
  .tab.active { background: var(--surface2); color: var(--text); }

  /* Toast */
  .toast {
    position: fixed; bottom: 100px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #2e2e50;
    color: var(--text);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    border: 1px solid var(--border);
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(15,15,26,0.95);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1; padding: 12px 0 10px;
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    background: none; border: none;
    color: var(--text-muted); cursor: pointer;
    font-size: 11px;
    font-family: 'Noto Sans TC', sans-serif;
    transition: color 0.2s;
  }
  .nav-btn.active { color: var(--accent-pos); }
  .nav-icon { font-size: 20px; line-height: 1; }

  /* Pages */
  .page { display: none; }
  .page.active { display: block; }

  .mb-4 { margin-bottom: 16px; }

  /* Scroll fade at bottom */
  .list-wrap {
    max-height: 400px; overflow-y: auto;
    padding-right: 2px;
  }
  .list-wrap::-webkit-scrollbar { width: 4px; }
  .list-wrap::-webkit-scrollbar-track { background: transparent; }
  .list-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">每日<span>一句</span></div>
  <div class="date-badge" id="dateBadge"></div>
</header>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Page: Today -->
<div class="container page active" id="pageToday">

  <div class="quote-card" id="quoteCard">
    <div class="open-quote">"</div>
    <div class="quote-type"><span class="dot"></span><span id="quoteTypeLabel"></span></div>
    <div class="quote-text" id="quoteText"></div>
    <div class="quote-source" id="quoteSource"></div>
    <div class="card-actions">
      <button class="btn btn-daily" id="btnDaily" onclick="showDailyQuote()">📅 今日語錄</button>
      <button class="btn btn-reshuffle" onclick="reshuffleQuote()"><span class="btn-icon">🔀</span> 再抽一次</button>
    </div>
  </div>

  <div class="section-title">所有語錄</div>
  <div style="margin-bottom: 24px;">
    <div class="tabs mb-4">
      <button class="tab active" onclick="filterList('all', this)">全部</button>
      <button class="tab" onclick="filterList('positive', this)">☀️ 正能量</button>
      <button class="tab" onclick="filterList('negative', this)">🌧️ 負能量</button>
    </div>
    <div class="list-wrap">
      <div class="quote-list" id="allQuoteList"></div>
    </div>
  </div>
</div>

<!-- Page: Add -->
<div class="container page" id="pageAdd">
  <div class="section-title">新增語錄</div>
  <div class="add-form">
    <div class="form-row">
      <div class="form-hint">語錄內容 *</div>
      <textarea id="newText" placeholder="輸入你想記下的句子…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-hint">來源 / 作者（選填）</div>
      <input type="text" id="newSource" placeholder="例：村上春樹">
    </div>
    <div class="form-row">
      <div class="form-hint">類型</div>
      <div class="toggle-row">
        <button class="toggle-btn active-pos" id="tPos" onclick="selectType('positive')">☀️ 正能量</button>
        <button class="toggle-btn" id="tNeg" onclick="selectType('negative')">🌧️ 負能量</button>
      </div>
    </div>
    <button class="btn btn-add" onclick="addQuote()">＋ 加入語錄庫</button>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="navToday" onclick="switchPage('today')">
    <span class="nav-icon">☀️</span>今日
  </button>
  <button class="nav-btn" id="navAdd" onclick="switchPage('add')">
    <span class="nav-icon">＋</span>新增
  </button>
</nav>

<script>
// ─── Built-in quotes ───────────────────────────────────────────────────────
const BUILTIN = [
  // Positive (10)
  { text: "你現在所承受的，正在雕刻你未來的樣子。", source: "無名氏", type: "positive" },
  { text: "每一個清晨都是一張空白的紙，你來決定今天寫什麼。", source: "無名氏", type: "positive" },
  { text: "不要和昨天比，要和昨天的自己比。", source: "無名氏", type: "positive" },
  { text: "即使走得很慢，也比站在原地強。", source: "無名氏", type: "positive" },
  { text: "你足夠好，只是還沒遇到懂你的人。", source: "無名氏", type: "positive" },
  { text: "陽光總在風雨後，請相信有彩虹。", source: "無名氏", type: "positive" },
  { text: "成長的代價是孤單，但收穫是自由。", source: "無名氏", type: "positive" },
  { text: "今天的勇敢，是明天的底氣。", source: "無名氏", type: "positive" },
  { text: "你笑，全世界陪你笑；你哭，只有你一個人哭。", source: "亦舒", type: "positive" },
  { text: "世上沒有白費的努力，也沒有碰巧的成功。", source: "無名氏", type: "positive" },
  // Negative (10)
  { text: "人生大多數的傷，都是自己舔好的。", source: "無名氏", type: "negative" },
  { text: "你以為的感同身受，不過是各自悲傷。", source: "無名氏", type: "negative" },
  { text: "有些人走著走著就散了，這是常態。", source: "無名氏", type: "negative" },
  { text: "大人的崩潰，都是靜悄悄的。", source: "無名氏", type: "negative" },
  { text: "努力不一定有回報，但不努力一定沒有。", source: "無名氏", type: "negative" },
  { text: "你越在乎的，越容易傷害你。", source: "無名氏", type: "negative" },
  { text: "累了就休息，但不要放棄。", source: "無名氏", type: "negative" },
  { text: "失眠的夜，想的都是白天沒臉想的事。", source: "無名氏", type: "negative" },
  { text: "世界上最遠的距離，是你在我面前，卻不知道我愛你。", source: "泰戈爾", type: "negative" },
  { text: "有時候沉默，不是沒話說，是不知道從何說起。", source: "無名氏", type: "negative" },
];

// ─── State ─────────────────────────────────────────────────────────────────
let newType = 'positive';
let currentFilter = 'all';
let isShowingDaily = true;

function loadUserQuotes() {
  try { return JSON.parse(localStorage.getItem('user_quotes') || '[]'); } catch { return []; }
}
function saveUserQuotes(q) { localStorage.setItem('user_quotes', JSON.stringify(q)); }

function getAllQuotes() { return [...BUILTIN, ...loadUserQuotes()]; }

// ─── Daily quote ────────────────────────────────────────────────────────────
function getDailyIndex() {
  const d = new Date();
  const seed = d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + d.getDate();
  return seed % getAllQuotes().length;
}

function showDailyQuote() {
  isShowingDaily = true;
  document.getElementById('btnDaily').style.opacity = '0.4';
  const quotes = getAllQuotes();
  displayQuote(quotes[getDailyIndex()]);
}

function reshuffleQuote() {
  isShowingDaily = false;
  document.getElementById('btnDaily').style.opacity = '1';
  const quotes = getAllQuotes();
  const card = document.getElementById('quoteCard');
  card.classList.add('fade-out');
  setTimeout(() => {
    const idx = Math.floor(Math.random() * quotes.length);
    displayQuote(quotes[idx]);
    card.classList.remove('fade-out');
    card.classList.add('fade-in');
    setTimeout(() => card.classList.remove('fade-in'), 500);
  }, 300);
}

function displayQuote(q) {
  const card = document.getElementById('quoteCard');
  card.className = 'quote-card ' + q.type;
  document.getElementById('quoteTypeLabel').textContent = q.type === 'positive' ? '正能量' : '負能量';
  document.getElementById('quoteText').textContent = q.text;
  document.getElementById('quoteSource').textContent = q.source ? '— ' + q.source : '';
}

// ─── List rendering ──────────────────────────────────────────────────────────
function renderList() {
  const list = document.getElementById('allQuoteList');
  const userQuotes = loadUserQuotes();
  const allQ = getAllQuotes();
  const filtered = currentFilter === 'all' ? allQ : allQ.filter(q => q.type === currentFilter);

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">還沒有語錄</div>';
    return;
  }

  list.innerHTML = filtered.map((q, i) => {
    // Check if it's a user quote (by finding in userQuotes)
    const globalIdx = allQ.indexOf(q);
    const isUser = globalIdx >= BUILTIN.length;
    const userIdx = isUser ? globalIdx - BUILTIN.length : -1;
    return `
      <div class="quote-item">
        <div class="quote-item-bar ${q.type === 'positive' ? 'pos' : 'neg'}"></div>
        <div class="quote-item-body">
          <div class="quote-item-text">${escHtml(q.text)}</div>
          <div class="quote-item-meta">
            <span class="${q.type === 'positive' ? 'tag-pos' : 'tag-neg'}">${q.type === 'positive' ? '☀️ 正能量' : '🌧️ 負能量'}</span>
            ${q.source ? `<span>— ${escHtml(q.source)}</span>` : ''}
            ${isUser ? '<span style="color:#9090b0;">· 自訂</span>' : ''}
          </div>
        </div>
        ${isUser ? `<button class="btn-delete" onclick="deleteQuote(${userIdx})" title="刪除">✕</button>` : ''}
      </div>`;
  }).join('');
}

function filterList(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

// ─── Add / Delete ────────────────────────────────────────────────────────────
function selectType(type) {
  newType = type;
  document.getElementById('tPos').className = 'toggle-btn' + (type === 'positive' ? ' active-pos' : '');
  document.getElementById('tNeg').className = 'toggle-btn' + (type === 'negative' ? ' active-neg' : '');
}

function addQuote() {
  const text = document.getElementById('newText').value.trim();
  if (!text) { showToast('請輸入語錄內容'); return; }
  const source = document.getElementById('newSource').value.trim();
  const userQ = loadUserQuotes();
  userQ.push({ text, source, type: newType });
  saveUserQuotes(userQ);
  document.getElementById('newText').value = '';
  document.getElementById('newSource').value = '';
  showToast('✓ 已加入語錄庫');
  renderList();
  switchPage('today');
}

function deleteQuote(userIdx) {
  const userQ = loadUserQuotes();
  if (userIdx < 0 || userIdx >= userQ.length) return;
  userQ.splice(userIdx, 1);
  saveUserQuotes(userQ);
  showToast('已刪除');
  renderList();
  // Refresh daily if needed
  if (isShowingDaily) showDailyQuote();
}

// ─── Nav ─────────────────────────────────────────────────────────────────────
function switchPage(page) {
  document.getElementById('pageToday').classList.toggle('active', page === 'today');
  document.getElementById('pageAdd').classList.toggle('active', page === 'add');
  document.getElementById('navToday').classList.toggle('active', page === 'today');
  document.getElementById('navAdd').classList.toggle('active', page === 'add');
  if (page === 'today') renderList();
}

// ─── Toast ───────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(d) {
  const days = ['日','一','二','三','四','五','六'];
  return `${d.getMonth()+1}/${d.getDate()} 週${days[d.getDay()]}`;
}

// ─── Init ────────────────────────────────────────────────────────────────────
(function init() {
  const d = new Date();
  document.getElementById('dateBadge').textContent = formatDate(d);
  showDailyQuote();
  renderList();
})();
</script>
